<ion-header>
  <ion-toolbar>
    <ion-title>Mes Notes</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="presentAddNoteAlert()">
        <ion-icon slot="icon-only" name="add-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list *ngIf="notes$ | async as notes"> 
    <ion-list-header>
      <ion-label>Notes (Total: {{ notes.length }})</ion-label>
    </ion-list-header>

    <ion-item *ngFor="let note of notes">
      <ion-label>
        <h2>{{ note.titre }}</h2>
        <p>{{ note.contenu.substring(0, 100) }}...</p>
        <p class="ion-text-wrap" style="font-size: 0.8em; color: gray;">
          Dernière modif: {{ note.dateModification }}
        </p>
      </ion-label>
      
      <ion-buttons slot="end">
        <ion-button (click)="updateNote(note)">
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-button>
        <ion-button color="danger" (click)="deleteNote(note.id!)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>

    <ion-item *ngIf="notes.length === 0">
      <ion-label>Aucune note trouvée. Ajoutez-en une !</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
