<ion-app>
  <ion-router-outlet></ion-router-outlet>
  <ion-split-pane contentId="main-content" when="md">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content class="sidebar-content">

        <div class="logo-container">
        <img src="assets/icon/CN..jpg" alt="Logo" width="80px" height="80px"/>
        <h1 class="logo-text"> CELLULE NUMERIQUE </h1>
        </div>

        <ion-list lines="none">
          <ion-item button routerLink="/home" routerDirection="root" class="menu-item" routerLinkActive="active">
            <ion-icon slot="start" name="grid-outline" class="icon-dashboard"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>

          

          <ion-item button routerLink="/enseignant" class="menu-item" routerLinkActive="active">
            <ion-icon slot="start" name="school-outline" class="icon-eno"></ion-icon>
            <ion-label>ENO</ion-label>
          </ion-item>

          <ion-item button routerLink="/etudiants" class="menu-item" routerLinkActive="active">
            <ion-icon slot="start" name="layers-outline" class="icon-filieres"></ion-icon>
            <ion-label>Filières</ion-label>
          </ion-item>
          

          <ion-item button routerLink="/emploi" class="menu-item" routerLinkActive="active">
            <ion-icon slot="start" name="book-outline" class="icon-pedagogie"></ion-icon>
            <ion-label>Pédagogiques</ion-label>
          </ion-item>

          <ion-item button routerLink="/deliberation" class="menu-item" routerLinkActive="active">
            <ion-icon slot="start" name="receipt-outline" class="icon-historique"></ion-icon>
            <ion-label>Historiques</ion-label>
          </ion-item>

          <ion-item button routerLink="/note" class="menu-item" routerLinkActive="active">
            <ion-icon slot="start" name="chatbubbles-outline" class="icon-messages"></ion-icon>
            <ion-label>Messages</ion-label>
          </ion-item>
        </ion-list>

      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
